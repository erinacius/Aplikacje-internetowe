<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prognoza Pogody - REST API Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="mainContent">
        <div class="search-card">
            <h1>Prognozator Pogody</h1>
            <p class="subtitle">REST API Client - Lab D</p>
            
            <div class="search-box">
                <input 
                    type="text" 
                    id="cityInput" 
                    placeholder="Wprowadź nazwę miasta..."
                    class="city-input"
                >
                <button id="searchBtn" class="search-btn">Pogoda</button>
            </div>

            <div style="margin-top: 1rem;">
                <button id="toggleContent" class="toggle-btn-large">Zobacz koty</button>
            </div>

            <div class="options-section">
                <div class="options-title">Dodatkowe opcje</div>
                <div class="options-grid">
                    <div class="option-item">
                        <input type="checkbox" id="showExtraInfo" checked>
                        <label for="showExtraInfo">Dodatkowe informacje</label>
                    </div>
                    <div class="option-item">
                        <input type="checkbox" id="showSunTimes" checked>
                        <label for="showSunTimes">Wschód/zachód słońca</label>
                    </div>
                    <div class="option-item">
                        <input type="checkbox" id="showFullDetails" checked>
                        <label for="showFullDetails">Pełne szczegóły</label>
                    </div>
                    <div class="unit-selector">
                        <label for="unitSelect">Jednostki:</label>
                        <select id="unitSelect">
                            <option value="metric" selected>Metryczne (°C)</option>
                            <option value="imperial">Imperialne (°F)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="error" class="error hidden"></div>
            <div id="loading" class="loading hidden">Ładowanie danych pogodowych...</div>
        </div>

        <div id="currentWeather" class="weather-card hidden">
            <h2>Aktualna pogoda - <span id="cityName"></span></h2>
            
            <div class="current-weather-content">
                <div class="weather-main">
                    <img id="weatherIcon" src="" alt="Weather icon" class="weather-icon-large">
                    <div class="temperature-box">
                        <div id="temperature" class="temperature"></div>
                        <div id="description" class="description"></div>
                    </div>
                </div>

                <div class="weather-details">
                    <div class="detail-item">
                        <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                        </svg>
                        <div>
                            <div class="detail-label">Wilgotność</div>
                            <div id="humidity" class="detail-value"></div>
                        </div>
                    </div>
                    <div class="detail-item">
                        <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
                        </svg>
                        <div>
                            <div class="detail-label">Wiatr</div>
                            <div id="wind" class="detail-value"></div>
                        </div>
                    </div>
                    <div class="detail-item">
                        <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 6v6l4 2"/>
                        </svg>
                        <div>
                            <div class="detail-label">Ciśnienie</div>
                            <div id="pressure" class="detail-value"></div>
                        </div>
                    </div>
                    <div class="detail-item">
                        <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <div>
                            <div class="detail-label">Widoczność</div>
                            <div id="visibility" class="detail-value"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="extraInfo" class="extra-info hidden"></div>
        </div>

        <div id="forecast" class="weather-card hidden">
            <h2>Prognoza na 5 dni</h2>
            <div id="forecastList" class="forecast-grid"></div>
        </div>
        </div>
    </div>

    <div id="backButton" class="back-button hidden">
        <button id="showContent" class="toggle-btn-large">Pokaż interfejs</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
