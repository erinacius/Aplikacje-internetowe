<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB C - Mapa Interaktywna z Puzzle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>LAB C - Mapa Interaktywna z Puzzle</h1>
<div class="container">
    <div class="permissions-section">
        <h2>Uprawnienia</h2>
        <button id="btnRequestLocation">Pobierz zgodę na lokalizację</button>
        <button id="btnRequestNotifications">Pobierz zgodę na powiadomienia</button>
        <div id="permissionsStatus"></div>
    </div>

    <div class="map-section">
        <h2>Mapa Interaktywna (Leaflet)</h2>
        <div class="map-controls">
            <button id="btnMyLocation">Moja lokalizacja</button>
            <button id="btnExportMap">Pobierz mapę</button>
            <button id="btnResetMap">Reset mapy</button>
        </div>
        <div id="mapContainer" class="map-container"></div>
        <div id="coordsInfo">
            <p>Koordynaty: <span id="coordsDisplay">---</span></p>
        </div>
    </div>

    

    <div class="puzzle-section">
        <h2>Puzzle - Ułóż mapę</h2>
        <button id="btnStartPuzzle">Rozpocznij puzzle</button>
        <div class="puzzle-container">
            <div id="board" class="board"></div>
            <div id="pieces" class="pieces"></div>
        </div>
        <div id="puzzleStatus"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="script.js"></script>
</body>
</html>
